[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-drift-lint"
version = "0.1.0"
description = "Static checks for LLM API calls that break when providers change model behavior."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Castillo González" }]
dependencies = []

[project.scripts]
llm-drift-lint = "llm_drift_lint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.1"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
